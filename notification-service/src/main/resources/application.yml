server:
  port: 8090
  servlet:
    context-path: /api/notifications

spring:
  application:
    name: notification-service
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:mysql://localhost:3306/acadevia_notifications?useSSL=false&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      pool-name: NotificationHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 10
          min-idle: 5

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.acadevia.*
        max.poll.records: 500

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@acadevia.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true

# Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      emailService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      pushService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
  retry:
    instances:
      emailRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.mail.MailSendException

# Custom Properties
acadevia:
  notification:
    from-email: "noreply@acadevia.com"
    from-name: "Acadevia Learning Platform"
    websocket:
      enabled: true
      endpoint: /ws/notifications
    batch:
      enabled: true
      size: 500
      interval-ms: 60000
    digest:
      daily-cron: "0 0 20 * * ?"       # 8 PM IST
      weekly-cron: "0 0 10 ? * SUN"     # Sunday 10 AM IST
    cleanup:
      retention-days: 90
      cron: "0 0 2 * * ?"              # 2 AM IST daily
    unread-cache-ttl: 3600              # 1 hour
    max-notifications-per-page: 50
    streak-reminder:
      enabled: true
      cron: "0 0 21 * * ?"             # 9 PM IST daily
