server:
  port: 8093

spring:
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
  application:
    name: sync-service
  datasource:
    url: jdbc:mysql://localhost:3306/acadevia_sync
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: false
    baseline-on-migrate: true
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sync-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    aws:
      # Credentials and endpoint are injected by Docker Compose via x-minio-env anchor:
      #   SPRING_CLOUD_AWS_ENDPOINT                  → spring.cloud.aws.endpoint
      #   SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY    → spring.cloud.aws.credentials.access-key
      #   SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY    → spring.cloud.aws.credentials.secret-key
      #   SPRING_CLOUD_AWS_REGION_STATIC             → spring.cloud.aws.region.static
      endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://minio:9000}
      credentials:
        access-key: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:minioadmin}
        secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:minioadmin}
      region:
        static: ${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}
      s3:
        # sync-service stores downloadable offline content in acadevia-documents
        bucket: acadevia-documents

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

acadevia:
  sync:
    batch-size: 100
    conflict-strategy: last-write-wins
    download:
      max-concurrent: 3
      chunk-size: 1048576 # 1MB
    websocket:
      endpoint: /ws/sync
