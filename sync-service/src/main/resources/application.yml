server:
  port: 8093

spring:
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
  application:
    name: sync-service
  datasource:
    url: jdbc:mysql://localhost:3306/acadevia_sync
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: false
    baseline-on-migrate: true
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sync-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:dummy}
        secret-key: ${AWS_SECRET_KEY:dummy}
      region:
        static: us-east-1
      s3:
        bucket: acadevia-sync-content

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

acadevia:
  sync:
    batch-size: 100
    conflict-strategy: last-write-wins
    download:
      max-concurrent: 3
      chunk-size: 1048576 # 1MB
    websocket:
      endpoint: /ws/sync
