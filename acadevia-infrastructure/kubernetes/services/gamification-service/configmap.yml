  DB_NAME: "acadevia_gamification"
  DB_USER: "acadevia_gamification_user"
  GAMIFICATION_XP_MULTIPLIER: "1.0"
  GAMIFICATION_STREAK_BONUS_ENABLED: "true"
  GAMIFICATION_DAILY_CHALLENGE_ENABLED: "true"
