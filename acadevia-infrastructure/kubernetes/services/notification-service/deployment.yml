apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: acadevia
  labels:
    app: notification-service
    app.kubernetes.io/part-of: acadevia
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: acadevia-sa
      containers:
        - name: notification-service
          image: acadevia/notification-service:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: notification-service-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: notification-db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: jwt-secret
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: smtp-host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: smtp-port
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: smtp-user
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: smtp-pass
            - name: SMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: sms-api-key
            - name: FCM_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: acadevia-secrets
                  key: fcm-server-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["notification-service"]
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: notification-service
