apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-service-config
  namespace: acadevia
data:
  SERVER_PORT: "8091"
  DB_NAME: "acadevia_analytics"
  DB_USER: "acadevia_analytics_user"
  ANALYTICS_AGGREGATION_INTERVAL_SECONDS: "300"
  ANALYTICS_RETENTION_DAYS: "365"
  ANALYTICS_REALTIME_ENABLED: "true"
