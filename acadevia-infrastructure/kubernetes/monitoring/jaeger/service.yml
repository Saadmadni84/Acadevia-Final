apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: acadevia
  labels:
    app: jaeger
    tier: monitoring
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      protocol: TCP
    - name: collector
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: agent
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
