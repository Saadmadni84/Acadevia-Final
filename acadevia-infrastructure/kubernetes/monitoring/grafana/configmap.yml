apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: acadevia
  labels:
    app: grafana
    tier: monitoring
data:
  grafana.ini: |
    [server]
    root_url = https://grafana.acadevia.in
    serve_from_sub_path = false

    [security]
    admin_user = admin
    disable_gravatar = true
    cookie_secure = true
    strict_transport_security = true

    [auth]
    disable_login_form = false
    disable_signout_menu = false

    [auth.anonymous]
    enabled = false

    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_role = Viewer

    [log]
    mode = console
    level = info

    [alerting]
    enabled = true

    [unified_alerting]
    enabled = true

    [analytics]
    check_for_updates = false
    reporting_enabled = false

  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          maxLines: 1000

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: acadevia
        orgId: 1
        folder: Acadevia
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
