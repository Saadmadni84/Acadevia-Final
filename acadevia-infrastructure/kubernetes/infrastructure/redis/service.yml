apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: acadevia
  labels:
    app: redis
    tier: infrastructure
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: acadevia
  labels:
    app: redis
    tier: infrastructure
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis
