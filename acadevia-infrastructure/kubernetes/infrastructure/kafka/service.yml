apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: acadevia
  labels:
    app: kafka
    tier: infrastructure
spec:
  clusterIP: None
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
    - port: 9093
      targetPort: 9093
      name: kafka-internal
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: acadevia
  labels:
    app: kafka
    tier: infrastructure
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
  selector:
    app: kafka
