apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: acadevia
  labels:
    app: zookeeper
    tier: infrastructure
spec:
  clusterIP: None
  ports:
    - port: 2181
      targetPort: 2181
      name: client
    - port: 2888
      targetPort: 2888
      name: follower
    - port: 3888
      targetPort: 3888
      name: election
  selector:
    app: zookeeper
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: acadevia
  labels:
    app: zookeeper
    tier: infrastructure
spec:
  type: ClusterIP
  ports:
    - port: 2181
      targetPort: 2181
      name: client
  selector:
    app: zookeeper
