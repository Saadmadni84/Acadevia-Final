name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  K8S_NAMESPACE: acadevia-production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - content-service
          - quiz-service
          - game-service
          - sync-service
          - gamification-service
          - leaderboard-service
          - notification-service
          - analytics-service
          - admin-service
          - locale-service
          - config-server
          - service-registry
          - acadevia-frontend
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        if: matrix.service != 'acadevia-frontend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build service JAR
        if: matrix.service != 'acadevia-frontend'
        run: |
          cd ${{ matrix.service }}
          mvn package -DskipTests -B

      - name: Setup Node.js 20
        if: matrix.service == 'acadevia-frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: acadevia-frontend/package-lock.json

      - name: Build frontend
        if: matrix.service == 'acadevia-frontend'
        run: |
          cd acadevia-frontend
          npm ci
          npm run build

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:prod-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pre-deploy-checks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run full test suite
        run: mvn verify -B

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Security scan — all images
        run: |
          SERVICES=(
            api-gateway auth-service user-service course-service
            content-service quiz-service game-service sync-service
            gamification-service leaderboard-service notification-service
            analytics-service admin-service locale-service
            config-server service-registry acadevia-frontend
          )

          for SERVICE in "${SERVICES[@]}"; do
            echo "Scanning $SERVICE..."
            docker pull ${{ env.REGISTRY }}/${SERVICE}:prod-${{ steps.sha.outputs.short }} || continue
            docker run --rm \
              aquasec/trivy:latest image \
              --severity CRITICAL \
              --exit-code 1 \
              ${{ env.REGISTRY }}/${SERVICE}:prod-${{ steps.sha.outputs.short }} || {
                echo "::error::CRITICAL vulnerability found in $SERVICE"
                exit 1
              }
          done

      - name: Verify staging is healthy
        run: |
          STAGING_URL="${{ secrets.STAGING_GATEWAY_URL }}"
          if [ -n "$STAGING_URL" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${STAGING_URL}/actuator/health" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "::error::Staging environment is unhealthy (HTTP $HTTP_CODE). Aborting production deploy."
              exit 1
            fi
            echo "✓ Staging is healthy"
          else
            echo "::warning::STAGING_GATEWAY_URL not set, skipping staging health check"
          fi

  deploy:
    needs: [build-and-push, pre-deploy-checks]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Run database migrations
        run: |
          echo "Running production database migrations..."
          kubectl apply -f acadevia-infrastructure/kubernetes/jobs/db-migration-job.yml \
            -n ${{ env.K8S_NAMESPACE }} || true
          kubectl wait --for=condition=complete job/db-migration \
            -n ${{ env.K8S_NAMESPACE }} --timeout=180s || {
              echo "::error::Database migration failed or timed out"
              exit 1
            }

      - name: Rolling update — all services
        id: rolling-update
        run: |
          IMAGE_TAG="prod-${{ steps.sha.outputs.short }}"
          SERVICES=(
            config-server
            service-registry
            api-gateway
            auth-service
            user-service
            course-service
            content-service
            quiz-service
            game-service
            sync-service
            gamification-service
            leaderboard-service
            notification-service
            analytics-service
            admin-service
            locale-service
            acadevia-frontend
          )

          for SERVICE in "${SERVICES[@]}"; do
            echo "Updating $SERVICE to $IMAGE_TAG..."
            kubectl set image deployment/${SERVICE} \
              ${SERVICE}=${{ env.REGISTRY }}/${SERVICE}:${IMAGE_TAG} \
              -n ${{ env.K8S_NAMESPACE }}
          done

      - name: Wait for rollout completion
        id: rollout
        run: |
          SERVICES=(
            config-server service-registry api-gateway
            auth-service user-service course-service
            content-service quiz-service game-service
            sync-service gamification-service leaderboard-service
            notification-service analytics-service admin-service
            locale-service acadevia-frontend
          )

          FAILED=()
          for SERVICE in "${SERVICES[@]}"; do
            echo "Waiting for $SERVICE rollout..."
            if ! kubectl rollout status deployment/${SERVICE} \
              -n ${{ env.K8S_NAMESPACE }} --timeout=300s 2>/dev/null; then
              FAILED+=("$SERVICE")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "rollout_failed=true" >> $GITHUB_OUTPUT
            echo "failed_services=${FAILED[*]}" >> $GITHUB_OUTPUT
            echo "::error::Rollout failed for: ${FAILED[*]}"
          else
            echo "rollout_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run smoke tests
        id: smoke
        run: |
          GATEWAY_URL=$(kubectl get svc api-gateway -n ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "localhost")

          ENDPOINTS=(
            "/actuator/health"
            "/api/auth/health"
            "/api/users/health"
            "/api/courses/health"
            "/api/content/health"
            "/api/quiz/health"
            "/api/game/health"
            "/api/notifications/health"
            "/api/leaderboard/health"
          )

          FAILED=()
          for ENDPOINT in "${ENDPOINTS[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${GATEWAY_URL}${ENDPOINT}" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" -ne 200 ]; then
              FAILED+=("$ENDPOINT")
            else
              echo "  ✓ $ENDPOINT OK"
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "smoke_failed=true" >> $GITHUB_OUTPUT
            echo "::error::Smoke tests failed for: ${FAILED[*]}"
          else
            echo "smoke_failed=false" >> $GITHUB_OUTPUT
            echo "✓ All smoke tests passed"
          fi

      - name: Rollback on failure
        if: steps.rollout.outputs.rollout_failed == 'true' || steps.smoke.outputs.smoke_failed == 'true'
        run: |
          echo "::error::Deployment failed! Initiating rollback..."
          SERVICES=(
            config-server service-registry api-gateway
            auth-service user-service course-service
            content-service quiz-service game-service
            sync-service gamification-service leaderboard-service
            notification-service analytics-service admin-service
            locale-service acadevia-frontend
          )

          for SERVICE in "${SERVICES[@]}"; do
            echo "Rolling back $SERVICE..."
            kubectl rollout undo deployment/${SERVICE} -n ${{ env.K8S_NAMESPACE }} || true
          done

          echo "::error::ROLLBACK COMPLETED. Production has been reverted to previous version."
          exit 1

  post-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          TAG="v$(date +'%Y%m%d')-${{ steps.sha.outputs.short }}"
          git tag "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.sha.outputs.short }}
          name: "Release v$(date +'%Y%m%d')-${{ steps.sha.outputs.short }}"
          body: |
            ## Production Release

            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')

            ### Services Deployed
            - api-gateway
            - auth-service
            - user-service
            - course-service
            - content-service
            - quiz-service
            - game-service
            - sync-service
            - gamification-service
            - leaderboard-service
            - notification-service
            - analytics-service
            - admin-service
            - locale-service
            - config-server
            - service-registry
            - acadevia-frontend
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [deploy, post-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy.result == 'success' && '🚀 Production deployment successful!' || '🚨 PRODUCTION DEPLOYMENT FAILED!' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.deploy.result == 'success' && '🚀 Production Deployment Successful' || '🚨 Production Deployment FAILED' }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Branch:* `main`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*Status:* ${{ needs.deploy.result }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
