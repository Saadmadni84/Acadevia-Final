      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/frontend/Dockerfile.prod
    image: ${REGISTRY}/frontend:${IMAGE_TAG}
    container_name: acadevia-frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  zk-data:
    driver: local
  zk-log:
    driver: local
  minio-data:
    driver: local

networks:
  acadevia-network:
    driver: bridge
