      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/admin-service/Dockerfile
    image: ${REGISTRY}/admin-service:${IMAGE_TAG}
    container_name: acadevia-admin-service
    environment:
      <<: *spring-env
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8097/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
