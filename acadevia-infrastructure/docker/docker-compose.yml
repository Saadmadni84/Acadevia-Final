# ============================================================
# Acadevia Platform — Full Local Development Stack
# ============================================================
# ONE command starts everything: infrastructure, control plane,
# all backend microservices and the frontend.
#
#   cd acadevia-infrastructure && make dev
#     (or: cd acadevia-infrastructure/docker && docker compose up -d --build)
#
# No `mvn spring-boot:run` is required for any service.
#
# Layout:
#   Infrastructure : mysql, redis, zookeeper, kafka, kafka-ui, kafka-init, minio, minio-init
#   Control plane  : service-registry (Eureka), config-server
#   Applications   : auth, user, course, content, quiz, game, gamification,
#                    leaderboard, notification, i18n, sync, admin
#   Edge           : api-gateway, frontend (React build served by nginx)
#
# Networking rules honoured here:
#   * container-to-container traffic uses Docker DNS names (mysql, redis,
#     kafka:29092, minio:9000, service-registry, config-server) — never localhost
#   * host-published ports are only those developers/tools genuinely need;
#     backend services stay internal (see docker-compose.exposed-ports.yml
#     to publish them for debugging)
#   * startup order is enforced with health checks + depends_on conditions,
#     not with sleeps
# ============================================================

x-spring-env: &spring-env
  # Resolved inside containers through Docker DNS service names.
  # These feed the ${...} placeholders in each service's application.yml and
  # in the config-server native configuration files.
  DB_HOST: ${MYSQL_HOST}
  DB_PORT: ${MYSQL_PORT}
  KAFKA_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  EUREKA_URL: http://service-registry:8761/eureka/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
  CONFIG_SERVER_HOST: config-server
  CONFIG_SERVER_PORT: "8888"
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

x-minio-env: &minio-env
  SPRING_CLOUD_AWS_ENDPOINT: http://minio:9000
  SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${MINIO_SECRET_KEY}
  SPRING_CLOUD_AWS_REGION_STATIC: us-east-1

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-healthcheck: &app-hc
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 60s

services:

  # ==============================
  #  INFRASTRUCTURE
  # ==============================

  mysql:
    image: mysql:8.0
    container_name: acadevia-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: acadevia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: acadevia-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log
    mem_limit: 512m
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: acadevia-kafka
    ports:
      - "9092:9092"        # host clients (Kafka UI on host, local tooling)
      - "29092:29092"     # internal Docker listener, also reachable from host if needed
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: acadevia-kafka-ui
    ports:
      - "8180:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: acadevia-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  # Creates every Acadevia event topic once the broker is healthy.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: acadevia-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    restart: "no"
    networks: [acadevia-network]
    logging: *logging

  minio:
    image: minio/minio:latest
    container_name: acadevia-minio
    ports:
      - "9000:9000"   # S3 API (also the in-network endpoint: http://minio:9000)
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  minio-init:
    image: minio/mc:latest
    container_name: acadevia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET_CONTENT: ${MINIO_BUCKET_CONTENT}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS}
    restart: "no"
    networks: [acadevia-network]
    logging: *logging

  # ==============================
  #  CONTROL PLANE
  # ==============================

  service-registry:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/service-registry/Dockerfile
    image: ${REGISTRY}/service-registry:${IMAGE_TAG}
    container_name: acadevia-service-registry
    ports:
      - "8761:8761"   # Eureka dashboard is a genuinely useful dev tool
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  config-server:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/config-server/Dockerfile
    image: ${REGISTRY}/config-server:${IMAGE_TAG}
    container_name: acadevia-config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  # ==============================
  #  BUSINESS MICROSERVICES
  # ==============================

  auth-service:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/auth-service/Dockerfile
    image: ${REGISTRY}/auth-service:${IMAGE_TAG}
    container_name: acadevia-auth-service
    environment:
      <<: *spring-env
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  user-service:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/user-service/Dockerfile
    image: ${REGISTRY}/user-service:${IMAGE_TAG}
    container_name: acadevia-user-service
    environment:
      <<: *spring-env
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  course-service:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/course-service/Dockerfile
    image: ${REGISTRY}/course-service:${IMAGE_TAG}
    container_name: acadevia-course-service
    environment:
      <<: *spring-env
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  content-service:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/content-service/Dockerfile
    image: ${REGISTRY}/content-service:${IMAGE_TAG}
    container_name: acadevia-content-service
    environment:
      <<: [*spring-env, *minio-env]
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      minio:    {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
