  api-gateway:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/api-gateway/Dockerfile
    image: ${REGISTRY}/api-gateway:${IMAGE_TAG}
    container_name: acadevia-api-gateway
    ports:
      - "8080:8080"   # single backend entry point for browser + frontend container
    environment:
      <<: *spring-env
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
    depends_on:
      redis:    {condition: service_healthy}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
      auth-service:     {condition: service_healthy}
      user-service:     {condition: service_healthy}
      course-service:   {condition: service_healthy}
      content-service:  {condition: service_healthy}
      quiz-service:     {condition: service_healthy}
      game-service:     {condition: service_healthy}
      gamification-service: {condition: service_healthy}
      leaderboard-service:  {condition: service_healthy}
      notification-service: {condition: service_healthy}
      i18n-service:     {condition: service_healthy}
      sync-service:     {condition: service_healthy}
      admin-service:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  frontend:
