      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  leaderboard-service:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/leaderboard-service/Dockerfile
    image: ${REGISTRY}/leaderboard-service:${IMAGE_TAG}
    container_name: acadevia-leaderboard-service
    environment:
      <<: *spring-env
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
