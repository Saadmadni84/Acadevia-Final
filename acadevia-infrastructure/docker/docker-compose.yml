      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/quiz-service/Dockerfile
    image: ${REGISTRY}/quiz-service:${IMAGE_TAG}
    container_name: acadevia-quiz-service
    environment:
      <<: *spring-env
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  game-service:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/game-service/Dockerfile
    image: ${REGISTRY}/game-service:${IMAGE_TAG}
    container_name: acadevia-game-service
    environment:
      <<: *spring-env
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]
      <<: *app-hc
    restart: unless-stopped
    networks: [acadevia-network]
    logging: *logging

  gamification-service:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/gamification-service/Dockerfile
    image: ${REGISTRY}/gamification-service:${IMAGE_TAG}
    container_name: acadevia-gamification-service
    environment:
      <<: *spring-env
    depends_on:
      mysql:    {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      service-registry: {condition: service_healthy}
      config-server:    {condition: service_healthy}
