      DB_PASS: ${I18N_DB_PASS}
      KAFKA_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8093/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - acadevia-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../../
      dockerfile: acadevia-infrastructure/docker/services/frontend/Dockerfile
    container_name: acadevia-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - acadevia-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ==============================
#  VOLUMES
# ==============================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  zk-data:
    driver: local
  zk-log:
    driver: local
  minio-data:
    driver: local

# ==============================
#  NETWORKS
# ==============================
networks:
  acadevia-network:
    driver: bridge
