# ============================================================
# Acadevia Platform - Kafka Broker Configuration
# ============================================================

# ---- Broker Basics ----
broker.id=0
# In production, each broker gets a unique ID (0, 1, 2, ...)

# ---- Listeners ----
listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://kafka:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# ---- ZooKeeper (legacy) / KRaft ----
# For ZooKeeper-based setup:
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

# ---- Log / Data Directories ----
log.dirs=/var/kafka-data
num.partitions=6
default.replication.factor=1
# Production: default.replication.factor=3
min.insync.replicas=1
# Production: min.insync.replicas=2

# ---- Log Retention ----
log.retention.hours=168
log.retention.bytes=-1
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
log.cleaner.enable=true

# ---- Network / Threads ----
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# ---- Replication ----
num.replica.fetchers=1
replica.fetch.max.bytes=1048576
replica.lag.time.max.ms=30000

# ---- Group Coordinator ----
group.initial.rebalance.delay.ms=3000
offsets.topic.replication.factor=1
# Production: offsets.topic.replication.factor=3
transaction.state.log.replication.factor=1
# Production: transaction.state.log.replication.factor=3
transaction.state.log.min.isr=1
# Production: transaction.state.log.min.isr=2

# ---- Message Size ----
message.max.bytes=10485760
replica.fetch.max.bytes=10485760

# ---- Compression ----
compression.type=producer

# ---- Auto Topic Creation ----
auto.create.topics.enable=false
