# ============================================================
# Acadevia Platform - Redis Production Configuration
# ============================================================

# Network
bind 0.0.0.0
port 6379
tcp-keepalive 60
timeout 300
tcp-backlog 511

# General
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Snapshotting (RDB persistence)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append-only file (AOF persistence)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Clients
maxclients 10000

# Security (set password via requirepass or via command line)
# requirepass your_redis_password_here

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Threaded I/O (Redis 6+)
io-threads 4
io-threads-do-reads yes
