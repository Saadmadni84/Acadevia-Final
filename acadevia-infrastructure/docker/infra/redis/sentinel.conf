# ============================================================
# Acadevia Platform - Redis Sentinel Configuration (HA)
# ============================================================

# Sentinel port
port 26379
daemonize no

# Monitor the master Redis instance
# sentinel monitor <master-name> <ip> <port> <quorum>
# quorum = number of sentinels that must agree the master is down
sentinel monitor acadevia-master redis-master 6379 2

# Time in ms before a master is considered down
sentinel down-after-milliseconds acadevia-master 5000

# Timeout for failover in ms
sentinel failover-timeout acadevia-master 60000

# Number of replicas that can be reconfigured simultaneously during failover
sentinel parallel-syncs acadevia-master 1

# Auth (uncomment and set if Redis requires a password)
# sentinel auth-pass acadevia-master your_redis_password_here

# Deny scripts reconfiguration (security)
sentinel deny-scripts-reconfig yes

# Logging
loglevel notice
logfile ""

# Resolve hostnames (Redis 6.2+)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
