# ============================================================
# Acadevia Platform - API Gateway Proxy
# ============================================================

server {
    listen 80;
    server_name api.acadevia.local;

    # ---- API routes ----
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 3600 always;

        # Preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ---- Auth routes (stricter rate limiting) ----
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }

    # ---- File uploads (larger body size) ----
    location /api/content/upload {
        client_max_body_size 500M;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---- Health check ----
    location /health {
        access_log off;
        proxy_pass http://api_gateway/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- Error pages ----
    error_page 502 503 504 /api_error.json;
    location = /api_error.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable","code":503}';
    }
}
