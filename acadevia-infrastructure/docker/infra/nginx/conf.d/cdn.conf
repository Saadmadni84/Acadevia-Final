# ============================================================
# Acadevia Platform - Static Asset / CDN Caching Configuration
# ============================================================

server {
    listen 80;
    server_name cdn.acadevia.local static.acadevia.local;

    # ---- Static assets from MinIO / object storage ----
    location /assets/ {
        proxy_pass http://minio:9000/acadevia-images/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Aggressive caching for immutable content
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;

        # CORS for font/media loading
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

        # Prevent content-type sniffing
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Video content (longer timeouts, no buffering) ----
    location /videos/ {
        proxy_pass http://minio:9000/acadevia-videos/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Moderate caching for video
        expires 7d;
        add_header Cache-Control "public, max-age=604800";

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;

        # Support range requests (seek in videos)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header Accept-Ranges bytes;
    }

    # ---- Documents ----
    location /documents/ {
        proxy_pass http://minio:9000/acadevia-documents/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Favicon / manifest ----
    location ~* ^/(favicon\.ico|manifest\.json|browserconfig\.xml)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- Font files ----
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ---- Health check ----
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
