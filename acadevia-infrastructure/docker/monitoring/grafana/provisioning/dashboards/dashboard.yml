# ============================================================
# Acadevia Grafana — Dashboard Provisioner
# ============================================================
apiVersion: 1

providers:
  - name: 'Acadevia Dashboards'
    orgId: 1
    folder: 'Acadevia'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/
      foldersFromFilesStructure: false
