# ============================================================
# Acadevia Grafana Configuration
# ============================================================

[server]
http_port = 3000
domain = grafana.acadevia.in
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
cookie_secure = true
strict_transport_security = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/business-dashboard.json

[log]
mode = console
level = info

[alerting]
enabled = true

[unified_alerting]
enabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
