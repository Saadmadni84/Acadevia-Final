server:
  port: 8084

spring:
  application:
    name: content-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
  datasource:
    url: jdbc:mysql://localhost:3306/acadevia_content_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: content-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.acadevia.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cloud:
    aws:
      endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://minio:9000}
      credentials:
        access-key: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:minioadmin}
        secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:minioadmin}
      region:
        static: ${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 520MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

acadevia:
  content:
    max-downloads-per-user: 50
    max-download-size-mb: 5120
    download-token-expiry-hours: 24
    download-content-expiry-days: 30
    video-completion-threshold: 90.0
    pop-question-buffer-sec: 5
    cdn-base-url: https://cdn.acadevia.com
  minio:
    bucket:
      videos: ${MINIO_BUCKET_VIDEOS:acadevia-videos}
      images: ${MINIO_BUCKET_IMAGES:acadevia-images}
      documents: ${MINIO_BUCKET_DOCUMENTS:acadevia-documents}
    # Host-accessible URL for presigned URLs returned to the browser
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    presigned-url-expiry-minutes: ${MINIO_PRESIGNED_EXPIRY_MINUTES:15}
    max-upload-size-mb: 500

logging:
  level:
    com.acadevia.content: DEBUG
    org.hibernate.SQL: WARN
