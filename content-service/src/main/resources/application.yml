server:
  port: 8084

spring:
  application:
    name: content-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acadevia_content}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: content-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.acadevia.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cloud:
    aws:
      endpoint: ${STORAGE_ENDPOINT:${SPRING_CLOUD_AWS_ENDPOINT:http://minio:9000}}
      credentials:
        access-key: ${STORAGE_ACCESS_KEY:${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:minioadmin}}
        secret-key: ${STORAGE_SECRET_KEY:${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:minioadmin}}
      region:
        static: ${STORAGE_REGION:${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}}

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 520MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

acadevia:
  content:
    max-downloads-per-user: 50
    max-download-size-mb: 5120
    download-token-expiry-hours: 24
    download-content-expiry-days: 30
    video-completion-threshold: 90.0
    pop-question-buffer-sec: 5
    cdn-base-url: ${STORAGE_PUBLIC_URL:${CDN_BASE_URL:https://cdn.acadevia.com}}
  minio:
    bucket:
      videos: ${STORAGE_BUCKET_VIDEOS:${MINIO_BUCKET_VIDEOS:acadevia-videos}}
      images: ${STORAGE_BUCKET_IMAGES:${MINIO_BUCKET_IMAGES:acadevia-images}}
      documents: ${STORAGE_BUCKET_DOCUMENTS:${MINIO_BUCKET_DOCUMENTS:acadevia-documents}}
      backups: ${STORAGE_BUCKET_BACKUPS:${MINIO_BUCKET_BACKUPS:acadevia-backups}}
    # Host-accessible URL for presigned URLs returned to the browser
    public-url: ${STORAGE_PUBLIC_URL:${MINIO_PUBLIC_URL:${CDN_BASE_URL:http://localhost:9000}}}
    presigned-url-expiry-minutes: ${STORAGE_PRESIGNED_EXPIRY_MINUTES:${MINIO_PRESIGNED_EXPIRY_MINUTES:15}}
    path-style-enabled: ${STORAGE_PATH_STYLE_ENABLED:true}
    max-upload-size-mb: 500

logging:
  level:
    com.acadevia.content: DEBUG
    org.hibernate.SQL: WARN
