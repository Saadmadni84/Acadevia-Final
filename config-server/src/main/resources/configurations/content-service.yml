server:
  port: ${PORT:8084}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:acadevia_content}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

storage:
  endpoint: ${STORAGE_ENDPOINT:${SPRING_CLOUD_AWS_ENDPOINT:http://minio:9000}}
  access-key: ${STORAGE_ACCESS_KEY:${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:minioadmin}}
  secret-key: ${STORAGE_SECRET_KEY:${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:minioadmin}}
  region: ${STORAGE_REGION:${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}}
  public-url: ${STORAGE_PUBLIC_URL:${MINIO_PUBLIC_URL:${CDN_BASE_URL:http://localhost:9000}}}
  path-style-enabled: ${STORAGE_PATH_STYLE_ENABLED:true}
  presigned-expiry-minutes: ${STORAGE_PRESIGNED_EXPIRY_MINUTES:15}
  bucket:
    videos: ${STORAGE_BUCKET_VIDEOS:${MINIO_BUCKET_VIDEOS:acadevia-videos}}
    images: ${STORAGE_BUCKET_IMAGES:${MINIO_BUCKET_IMAGES:acadevia-images}}
    documents: ${STORAGE_BUCKET_DOCUMENTS:${MINIO_BUCKET_DOCUMENTS:acadevia-documents}}
    backups: ${STORAGE_BUCKET_BACKUPS:${MINIO_BUCKET_BACKUPS:acadevia-backups}}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      pool-name: content-service-hikari
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.acadevia: DEBUG
