server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configurations/
        overrides:
          management:
             endpoints:
               web:
                 exposure:
                   include: "*"
  # Simplified actuator security for internal infrastructure
  security:
    user:
      name: user
      password: ${CONFIG_SERVER_PASSWORD:password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
