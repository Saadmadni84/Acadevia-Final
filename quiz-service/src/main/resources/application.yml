server:
  port: 8085

spring:
  application:
    name: quiz-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
  datasource:
    url: jdbc:mysql://localhost:3306/acadevia_quiz_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: quiz-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

acadevia:
  quiz:
    adaptive:
      target-accuracy-low: 65
      target-accuracy-high: 85
      recent-window-size: 10
    multiplayer:
      session-expiry-minutes: 30
      max-players: 8
      default-question-time-sec: 20
    daily-challenge:
      questions-per-challenge: 10
      time-limit-minutes: 10
